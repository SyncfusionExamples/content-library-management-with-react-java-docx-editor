# Path mapping for Azure App Service hosting.
#
# The site is served under this sub-path:
#   https://<host>/content-library-management-with-react-java-docx-editor/
# The client build uses the SAME base path (see Client-Side/vite.config.js),
# and its static files are bundled into src/main/resources/static/ by
# `npm run build` (see Client-Side/package.json) so Spring Boot serves the
# SPA and the API from the same origin, same path prefix. No CORS needed.
#
# Azure App Service injects PORT via the WEBSITES_PORT / PORT env vars;
# Spring Boot maps server.port from the PORT environment variable
# automatically via its relaxed binding.
server.servlet.context-path=/content-library-management-with-react-java-docx-editor